<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Desk">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="app.css">
  <title>Desk</title>
</head>
<body>
  <div id="app">
    <section class="tab" id="tab-home" data-tab="home"></section>
    <section class="tab" id="tab-bots" data-tab="bots" hidden></section>
    <section class="tab" id="tab-activity" data-tab="activity" hidden></section>
    <section class="tab" id="tab-account" data-tab="account" hidden></section>
  </div>
  <div id="stack"></div>
  <nav id="tabbar">
    <button data-go="home" class="on" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button data-go="bots" aria-label="Bots"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="3"/><circle cx="9" cy="13" r="1.6" class="hole"/><circle cx="15" cy="13" r="1.6" class="hole"/><path d="M12 3v4" class="stroke"/></svg><span>Bots</span></button>
    <button data-go="activity" aria-label="Activity"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4" class="stroke"/></svg><span>Activity</span></button>
    <button data-go="account" aria-label="Account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg><span>Account</span></button>
  </nav>
  <div id="toast" hidden></div>
  <script src="chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
